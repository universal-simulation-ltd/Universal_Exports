<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Universal Exports — open-source trade finance &amp; Export Agreements</title>
    <meta name="description" content="Universal Exports — a fully open-source platform for Export Agreements and trade finance documents. Self-host for free, or store online in your enterprise account." />
    <meta name="author" content="UNI SIM" />
    <meta name="theme-color" content="#F76A1F" />
    <!-- universalexports.app is the primary domain; the same build is also
         served at opensource.unisim.co.uk/exports/ (portal Worker), which this
         canonical de-duplicates for search engines. -->
    <link rel="canonical" href="https://universalexports.app/" />

    <meta property="og:title" content="Universal Exports — open-source trade finance &amp; Export Agreements" />
    <meta property="og:description" content="Fully open-source platform for Export Agreements and trade finance documents. Self-host for free, or store online in your enterprise account." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://universalexports.app/" />
    <meta property="og:image" content="https://universalexports.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@unisim" />
    <meta name="twitter:title" content="Universal Exports — open-source trade finance &amp; Export Agreements" />
    <meta name="twitter:description" content="Fully open-source platform for Export Agreements and trade-finance documents. Self-host for free, or store online in your enterprise account." />
    <meta name="twitter:image" content="https://universalexports.app/og-image.png" />
    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal Exports",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "url": "https://universalexports.app/",
      "description": "Universal Exports — a fully open-source platform for Export Agreements and trade finance documents. Self-host for free, or store online in your enterprise account.",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "author": [
        {
          "@type": "Person",
          "name": "James Markey",
          "honorificSuffix": "MBE",
          "jobTitle": "Founder & Director",
          "url": "https://www.unisim.co.uk/about-james"
        },
        {
          "@type": "Organization",
          "name": "UNI·SIM",
          "url": "https://www.unisim.co.uk",
          "subjectOf": {
            "@type": "BlogPosting",
            "name": "Welcome to the UNI·SIM studio",
            "url": "https://www.unisim.co.uk/blog/welcome-to-uni-sim"
          }
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
